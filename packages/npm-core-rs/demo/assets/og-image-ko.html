<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>docxly OG KO</title>
    <style>
      :root {
        --blue-050: #eff6ff;
        --blue-100: #dbeafe;
        --blue-500: #2563eb;
        --blue-600: #1d4ed8;
        --blue-700: #1e40af;
        --neutral-950: #0f172a;
        --neutral-700: #334155;
        --neutral-500: #64748b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.24), transparent 32%),
          linear-gradient(135deg, #eff6ff 0%, #ffffff 44%, #dbeafe 100%);
        color: var(--neutral-700);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 52px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.95fr);
        gap: 28px;
        height: 100%;
      }

      .left {
        display: grid;
        align-content: start;
        gap: 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 22px;
      }

      .brand img {
        width: auto;
        height: 48px;
      }

      .brand-copy {
        display: grid;
        gap: 4px;
      }

      .brand-wordmark {
        color: var(--neutral-950);
        font-size: 42px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .brand-tag {
        color: var(--blue-600);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.2;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--neutral-950);
        font-size: 68px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.98;
      }

      .lede {
        max-width: 42rem;
        margin: 0;
        color: var(--neutral-700);
        font-size: 26px;
        line-height: 1.35;
      }

      .proof {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 50px;
        padding: 0 20px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.1);
        color: var(--blue-700);
        font-size: 18px;
        font-weight: 700;
      }

      .proof strong {
        margin-right: 10px;
        font-size: 28px;
      }

      .right {
        display: grid;
        align-content: start;
        gap: 16px;
        padding: 24px;
        border: 1px solid rgba(37, 99, 235, 0.12);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.1);
      }

      .eyebrow {
        margin: 0;
        color: var(--blue-600);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.2;
      }

      .install-title {
        margin: 0;
        color: var(--neutral-950);
        font-size: 38px;
        font-weight: 700;
        line-height: 1.1;
      }

      .install-copy {
        margin: 0;
        color: var(--neutral-950);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.35;
      }

      .command {
        margin: 0;
        padding: 16px 18px;
        border-radius: 18px;
        background: var(--neutral-950);
        color: white;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        font-family: "SFMono-Regular", "Consolas", monospace;
      }

      .footer {
        margin-top: auto;
        color: var(--neutral-500);
        font-size: 18px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="grid">
        <div class="left">
          <div class="brand">
            <img src="./logo.png" alt="docxly 로고" />
            <div class="brand-copy">
              <span class="brand-wordmark">docxly</span>
              <span class="brand-tag">제품에 넣어 쓰는 문서 생성 엔진</span>
            </div>
          </div>

          <h1>브라우저에서 HWPX와 DOCX를 바로 만들어 보세요</h1>
          <p class="lede">
            같은 Rust 코어로 Node와 브라우저에서 문서를 만들고, 백엔드 변환 서비스 없이
            바로 파일을 생성할 수 있습니다.
          </p>
          <p class="proof"><strong>105x</strong> 요약 DOCX 벤치마크에서 Pandoc보다 빠름</p>
        </div>

        <aside class="right">
          <p class="eyebrow">설치</p>
          <p class="install-title">설치 판단에 필요한 핵심 수치</p>
          <p class="install-copy">제품 안에 문서 생성을 넣어야 한다면 docxly가 더 잘 맞습니다.</p>
          <p class="command">npm install @docxly/core-rs</p>
          <p class="footer">DOCX와 HWPX를 같은 코어로 지원합니다.</p>
        </aside>
      </section>
    </main>
  </body>
</html>
