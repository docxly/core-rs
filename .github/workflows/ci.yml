name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.114 --locked

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Lint Rust
        run: npm run lint:rust

      - name: Test Rust
        run: npm run test:rust

      - name: WASM feasibility gate
        run: cargo build -p core-rs --target wasm32-unknown-unknown --release

      - name: Check cross-package version sync
        run: npm run check:version -w @docxly/core-rs

      - name: Build web package
        run: npm run build:web

      - name: Run web smoke tests
        run: npm run test:web
